<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Teste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Aplicação de Usuários</h1>

        <div class="card">
            <label for="nome">Digite um nome:</label>
            <div class="input-group">
                <input type="text" name="nome" id="nome" placeholder="Ex: Leanne...">
                <button id="buscar">Buscar</button>
            </div>
        </div>

        <div class="card action-card">
            <button id="botao">Carregar usuários</button>
        </div>

        <p id="erro"></p>
        <div id="usuarios"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
